x-api-image: &api-image
  image: pursuit-api:${PURSUIT_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PURSUIT_ALLOW_INSECURE_LOCAL_MIGRATIONS: "true"

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "PursuitDb"
      POSTGRES_USER: "pursuit"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pursuit -d PursuitDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
    command: azurite-blob --blobHost 0.0.0.0

  migrate:
    <<: *api-image
    entrypoint: ["/app/migrations/Pursuit.Migrations"]
    environment:
      DOTNET_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=PursuitDb;Username=pursuit;Password=${POSTGRES_PASSWORD};SSL Mode=Disable;GSS Encryption Mode=Disable;"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=PursuitDb;Username=pursuit;Password=${POSTGRES_PASSWORD};SSL Mode=Disable;GSS Encryption Mode=Disable;"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "Pursuit"
      JwtSettings__Audience: "PursuitUsers"
      JwtSettings__ExpiryInMinutes: "15"
      RedisSettings__ConnectionString: "redis:6379"
      RabbitMqSettings__Host: "rabbitmq"
      RabbitMqSettings__Port: "5672"
      RabbitMqSettings__Username: "guest"
      RabbitMqSettings__Password: "guest"
      AzureBlobSettings__ConnectionString: "UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite"
      AzureBlobSettings__ContainerName: "resumes"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_started

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: "http://localhost:5000"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
