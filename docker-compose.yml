services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PursuitDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "Pursuit"
      JwtSettings__Audience: "PursuitUsers"
      JwtSettings__ExpiryInMinutes: "60"
      RedisSettings__ConnectionString: "redis:6379"
      RabbitMqSettings__Host: "rabbitmq"
      RabbitMqSettings__Port: "5672"
      RabbitMqSettings__Username: "guest"
      RabbitMqSettings__Password: "guest"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  sqlserver_data: