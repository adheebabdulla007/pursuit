name: pursuit-e2e

services:

  sqlserver-e2e:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1435:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis-e2e:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  rabbitmq-e2e:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "pursuit_e2e"
      RABBITMQ_DEFAULT_PASS: "pursuit_e2e_pass"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  azurite-e2e:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10001:10000"
    command: azurite-blob --blobHost 0.0.0.0

  migrate-e2e:
    image: pursuit-api-e2e:${PURSUIT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/migrations/efbundle"]
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver-e2e,1433;Database=PursuitE2E;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver-e2e:
        condition: service_healthy
