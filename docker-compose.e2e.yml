name: pursuit-e2e

services:

  postgres-e2e:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "PursuitDb"
      POSTGRES_USER: "pursuit"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pursuit -d PursuitDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-e2e:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  rabbitmq-e2e:
    image: rabbitmq:3-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "pursuit_e2e"
      RABBITMQ_DEFAULT_PASS: "pursuit_e2e_pass"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  azurite-e2e:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10001:10000"
    command: azurite-blob --blobHost 0.0.0.0

  migrate-e2e:
    image: pursuit-api-e2e:${PURSUIT_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PURSUIT_ALLOW_INSECURE_LOCAL_MIGRATIONS: "true"
    entrypoint: ["/app/migrations/Pursuit.Migrations"]
    environment:
      DOTNET_ENVIRONMENT: "Testing"
      ConnectionStrings__DefaultConnection: "Host=postgres-e2e;Port=5432;Database=PursuitDb;Username=pursuit;Password=${POSTGRES_PASSWORD};SSL Mode=Disable;GSS Encryption Mode=Disable;"
    depends_on:
      postgres-e2e:
        condition: service_healthy
